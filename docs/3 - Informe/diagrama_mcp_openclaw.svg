<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Dos clientes para las mismas herramientas de consulta</text>

  <text x="20" y="62" font-size="12" font-weight="600" fill="#1d4ed8">Camino en producción (Módulo 3)</text>
  <text x="20" y="242" font-size="12" font-weight="600" fill="#b45309">Segundo cliente (Taller 3)</text>

  <g stroke="#374151" stroke-width="1.5">
    <rect x="20" y="75" width="130" height="56" rx="8" fill="#eff6ff"/>
    <rect x="200" y="75" width="150" height="56" rx="8" fill="#eff6ff"/>
    <rect x="400" y="75" width="170" height="56" rx="8" fill="#eff6ff"/>

    <rect x="20" y="255" width="130" height="56" rx="8" fill="#fffbeb" stroke-dasharray="6 4"/>
    <rect x="200" y="255" width="150" height="56" rx="8" fill="#fffbeb"/>
    <rect x="400" y="255" width="170" height="56" rx="8" fill="#fffbeb"/>

    <rect x="640" y="150" width="230" height="76" rx="8" fill="#ecfdf5"/>
    <rect x="640" y="305" width="110" height="60" rx="8" fill="#f3f4f6"/>
    <rect x="760" y="305" width="110" height="60" rx="8" fill="#f3f4f6"/>
  </g>

  <g text-anchor="middle" fill="#111827">
    <text x="85" y="98" font-weight="600">Cliente</text><text x="85" y="116" font-size="11">WhatsApp</text>
    <text x="275" y="98" font-weight="600">API FastAPI</text><text x="275" y="116" font-size="11">/webhook · PostgreSQL</text>
    <text x="485" y="98" font-weight="600">Agente LangChain</text><text x="485" y="116" font-size="11">prompt v9 · DeepSeek flash</text>

    <text x="85" y="278" font-weight="600">Cliente</text><text x="85" y="296" font-size="11">Telegram (pendiente)</text>
    <text x="275" y="278" font-weight="600">OpenClaw Gateway</text><text x="275" y="296" font-size="11">identidad · perfil messaging</text>
    <text x="485" y="278" font-weight="600">Servidor MCP «celsia»</text><text x="485" y="296" font-size="11">stdio · solo lectura</text>

    <text x="755" y="176" font-weight="600">Herramientas de consulta</text>
    <text x="755" y="196" font-size="11">buscar en la base (significado + palabras)</text>
    <text x="755" y="212" font-size="11">consultar datos exactos (con «Total: N»)</text>

    <text x="695" y="330" font-weight="600">Qdrant</text><text x="695" y="348" font-size="11">1.690 fragmentos</text>
    <text x="815" y="330" font-weight="600">Tablas</text><text x="815" y="348" font-size="11">sedes · contactos</text>
  </g>

  <g stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#flecha)">
    <line x1="150" y1="103" x2="198" y2="103"/>
    <line x1="350" y1="103" x2="398" y2="103"/>
    <line x1="570" y1="103" x2="638" y2="170"/>
    <line x1="150" y1="283" x2="198" y2="283" stroke-dasharray="6 4"/>
    <line x1="350" y1="283" x2="398" y2="283"/>
    <line x1="570" y1="283" x2="638" y2="206"/>
    <line x1="695" y1="226" x2="695" y2="303"/>
    <line x1="815" y1="226" x2="815" y2="303"/>
  </g>

  <rect x="190" y="322" width="390" height="62" rx="8" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="385" y="344" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">Endurecido</text>
  <text x="385" y="362" text-anchor="middle" font-size="11" fill="#374151">sandbox Docker · sin comandos ni archivos · solo celsia__*</text>
  <text x="385" y="377" text-anchor="middle" font-size="11" fill="#374151">un chat separado por persona · permisos elevados apagados</text>
  <text x="880" y="392" text-anchor="end" font-size="10" fill="#6b7280">Línea punteada del cliente: bot de Telegram aún sin crear.</text>
</svg>
