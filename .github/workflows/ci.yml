name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Instalar dependencias del lock
        run: uv sync --frozen
      - name: Revision de errores (ruff) y lock vigente
        run: make lint
      - name: Pruebas de componentes (sin Gemini ni Ollama)
        run: make test
