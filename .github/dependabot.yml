version: 2

updates:
  # Dependencias de Python / uv (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0  # sin PRs automáticos durante la entrega del Módulo 2; subir a 5 para reactivarlos
    labels:
      - chore
      - infra
    commit-message:
      prefix: "chore"

  # Acciones de GitHub usadas en los workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0  # sin PRs automáticos durante la entrega del Módulo 2; subir a 5 para reactivarlos
    labels:
      - chore
      - infra
    commit-message:
      prefix: "chore"
