name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Instalar dependencias del lock
        run: uv sync --frozen --all-groups
      - name: Revision de errores (ruff) y lock vigente
        run: make lint
      - name: Validar skills (frontmatter, tamano y seguridad)
        run: make skills-check
      - name: Pruebas de componentes (sin Gemini)
        run: make test
