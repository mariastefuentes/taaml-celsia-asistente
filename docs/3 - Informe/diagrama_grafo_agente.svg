<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="900" height="570" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Grafo del agente (LangGraph): el ciclo de un turno</text>
  <text x="450" y="44" text-anchor="middle" font-size="11" fill="#6b7280">Nodos de create_agent tal como los exporta agente.get_graph()</text>

  <g stroke="#374151" stroke-width="1.5">
    <rect x="180" y="58" width="140" height="34" rx="17" fill="#f3f4f6"/>
    <rect x="120" y="120" width="260" height="54" rx="8" fill="#fef9c3"/>
    <rect x="120" y="202" width="260" height="150" rx="8" fill="#dbeafe"/>
    <rect x="120" y="382" width="260" height="54" rx="8" fill="#fef9c3"/>
    <rect x="520" y="210" width="300" height="100" rx="8" fill="#dcfce7"/>
    <rect x="470" y="404" width="120" height="34" rx="17" fill="#bfb6fc"/>
  </g>
  <g stroke="#6b7280" stroke-width="1">
    <rect x="135" y="236" width="230" height="26" rx="5" fill="#ffffff"/>
    <rect x="135" y="268" width="230" height="26" rx="5" fill="#ffffff"/>
    <rect x="135" y="300" width="230" height="26" rx="5" fill="#ffffff"/>
  </g>

  <text x="250" y="80" text-anchor="middle" font-weight="600">__start__</text>
  <text x="250" y="143" text-anchor="middle" font-weight="600">SummarizationMiddleware</text>
  <text x="250" y="161" text-anchor="middle" font-size="11">before_model: resume si lo guardado pasa de 8.000 tokens</text>
  <text x="250" y="224" text-anchor="middle" font-weight="600">model</text>
  <text x="250" y="254" text-anchor="middle" font-size="12">con_fecha_de_hoy: prompt del turno</text>
  <text x="250" y="286" text-anchor="middle" font-size="12">limitar_historial: 3.000 tokens</text>
  <text x="250" y="318" text-anchor="middle" font-size="12">Gemini 3.8 Flash · respaldo llama3.2</text>
  <text x="250" y="343" text-anchor="middle" font-size="10" fill="#6b7280">cada llamada al modelo pasa por las tres capas</text>
  <text x="250" y="405" text-anchor="middle" font-weight="600">ToolCallLimitMiddleware</text>
  <text x="250" y="423" text-anchor="middle" font-size="11">after_model: máximo 4 herramientas por turno</text>

  <text x="670" y="234" text-anchor="middle" font-weight="600">tools</text>
  <text x="670" y="254" text-anchor="middle" font-size="12">consultar_datos · buscar_en_base</text>
  <text x="670" y="272" text-anchor="middle" font-size="12">guardar_dato_del_cliente</text>
  <text x="670" y="290" text-anchor="middle" font-size="12">recordar_datos_del_cliente</text>
  <text x="530" y="426" text-anchor="middle" font-weight="600">__end__</text>

  <g stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#flecha)">
    <path d="M250,92 L250,118"/>
    <path d="M250,174 L250,200"/>
    <path d="M250,352 L250,380"/>
    <path d="M380,395 L450,395 L450,260 L518,260"/>
    <path d="M380,424 L468,424"/>
  </g>
  <path d="M820,260 L860,260 L860,147 L382,147" stroke="#374151" stroke-width="1.6" fill="none" stroke-dasharray="6,4" marker-end="url(#flecha)"/>

  <text x="458" y="340" font-size="11" fill="#111827">el modelo pide una herramienta</text>
  <text x="602" y="426" font-size="11" fill="#111827">el modelo responde: la respuesta sale al cliente</text>
  <text x="600" y="139" font-size="11" fill="#111827" text-anchor="middle">con el resultado, vuelve a pasar por el resumen y el modelo</text>

  <rect x="30" y="462" width="840" height="92" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="450" y="484" text-anchor="middle" font-weight="600">Después de cada paso se guarda un punto de control (checkpointer, por thread_id)</text>
  <g stroke="#374151" stroke-width="1.3">
    <rect x="55" y="496" width="240" height="46" rx="6" fill="#e0e7ff"/>
    <rect x="330" y="496" width="240" height="46" rx="6" fill="#e0e7ff"/>
    <rect x="605" y="496" width="240" height="46" rx="6" fill="#e0e7ff"/>
  </g>
  <text x="175" y="516" text-anchor="middle" font-weight="600">Historial del hilo</text>
  <text x="175" y="533" text-anchor="middle" font-size="11">todos los mensajes, con herramientas</text>
  <text x="450" y="516" text-anchor="middle" font-weight="600">Viaje en el tiempo</text>
  <text x="450" y="533" text-anchor="middle" font-size="11">historial, replay y fork de un hilo</text>
  <text x="725" y="516" text-anchor="middle" font-weight="600">Sobrevive al reinicio</text>
  <text x="725" y="533" text-anchor="middle" font-size="11">SqliteSaver o PostgresSaver</text>
</svg>
