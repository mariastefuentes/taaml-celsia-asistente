<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="980" height="600" fill="#ffffff"/>
  <text x="490" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Del WhatsApp del cliente a la respuesta: arquitectura de punta a punta (Módulo 3, vía 2)</text>
  <text x="490" y="46" text-anchor="middle" fill="#4b5563">Servidor propio en FastAPI, sin N8N: nosotros recibimos el webhook de Meta y enviamos la respuesta</text>

  <!-- cliente y Meta -->
  <rect x="20" y="215" width="120" height="64" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="80" y="242" text-anchor="middle" font-weight="600" fill="#14532d">Cliente</text>
  <text x="80" y="260" text-anchor="middle" fill="#14532d">WhatsApp</text>

  <rect x="190" y="215" width="130" height="64" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="255" y="242" text-anchor="middle" font-weight="600" fill="#0c4a6e">Meta</text>
  <text x="255" y="260" text-anchor="middle" fill="#0c4a6e">API Cloud de WhatsApp</text>

  <rect x="20" y="400" width="120" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="80" y="425" text-anchor="middle" font-weight="600" fill="#111827">Frontend React</text>
  <text x="80" y="442" text-anchor="middle" fill="#374151">(Módulo 2)</text>

  <!-- API -->
  <rect x="360" y="70" width="250" height="400" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="485" y="92" text-anchor="middle" font-weight="600" fill="#4c1d95">API FastAPI (nuestro servidor)</text>
  <rect x="376" y="106" width="218" height="62" rx="6" fill="#ffffff" stroke="#a78bfa"/>
  <text x="485" y="127" text-anchor="middle" font-weight="600" fill="#111827">POST /webhook/whatsapp</text>
  <text x="485" y="145" text-anchor="middle" fill="#374151">firma X-Hub-Signature-256,</text>
  <text x="485" y="159" text-anchor="middle" fill="#374151">200 enseguida, mensaje ya visto</text>
  <rect x="376" y="180" width="218" height="46" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="485" y="201" text-anchor="middle" font-weight="600" fill="#7c2d12">Límite por teléfono</text>
  <text x="485" y="216" text-anchor="middle" fill="#7c2d12">8 mensajes por minuto</text>
  <rect x="376" y="238" width="218" height="40" rx="6" fill="#ffffff" stroke="#a78bfa"/>
  <text x="485" y="263" text-anchor="middle" fill="#111827"><tspan font-weight="600">POST /chat</tspan> {mensaje, telefono} → JSON</text>
  <rect x="376" y="290" width="218" height="40" rx="6" fill="#ffffff" stroke="#a78bfa"/>
  <text x="485" y="315" text-anchor="middle" fill="#111827"><tspan font-weight="600">POST /api/chat</tspan> (streaming SSE)</text>
  <rect x="376" y="342" width="218" height="52" rx="6" fill="#ffffff" stroke="#a78bfa"/>
  <text x="485" y="363" text-anchor="middle" fill="#111827"><tspan font-weight="600">POST /aprobar</tspan></text>
  <text x="485" y="380" text-anchor="middle" fill="#374151">encabezado X-Aprobador</text>
  <rect x="376" y="406" width="218" height="52" rx="6" fill="#ffffff" stroke="#a78bfa"/>
  <text x="485" y="427" text-anchor="middle" fill="#111827"><tspan font-weight="600">teléfono → hash</tspan></text>
  <text x="485" y="444" text-anchor="middle" fill="#374151">el número no se guarda en claro</text>

  <!-- agente -->
  <rect x="660" y="70" width="300" height="230" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="810" y="92" text-anchor="middle" font-weight="600" fill="#064e3b">Agente (LangChain create_agent)</text>
  <rect x="676" y="106" width="268" height="40" rx="6" fill="#ffffff" stroke="#34d399"/>
  <text x="810" y="124" text-anchor="middle" fill="#111827"><tspan font-weight="600">dynamic_prompt</tspan>: prompt v7 + fecha</text>
  <text x="810" y="139" text-anchor="middle" fill="#374151">historial recortado y resumido</text>
  <rect x="676" y="156" width="268" height="40" rx="6" fill="#ffffff" stroke="#34d399"/>
  <text x="810" y="174" text-anchor="middle" fill="#111827"><tspan font-weight="600">function calling</tspan>: el modelo elige</text>
  <text x="810" y="189" text-anchor="middle" fill="#374151">la herramienta con esquema Pydantic</text>
  <rect x="676" y="206" width="268" height="40" rx="6" fill="#ffffff" stroke="#34d399"/>
  <text x="810" y="224" text-anchor="middle" fill="#111827"><tspan font-weight="600">errores_amables</tspan> + validación del reclamo</text>
  <text x="810" y="239" text-anchor="middle" fill="#374151">si una herramienta falla, responde con cortesía</text>
  <rect x="676" y="254" width="268" height="38" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="810" y="270" text-anchor="middle" font-weight="600" fill="#78350f">HumanInTheLoopMiddleware</text>
  <text x="810" y="285" text-anchor="middle" fill="#78350f">pausa radicar_reclamo hasta que decida una persona</text>

  <!-- piezas externas del agente -->
  <rect x="660" y="340" width="140" height="74" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="730" y="362" text-anchor="middle" font-weight="600" fill="#7f1d1d">Modelo de lenguaje</text>
  <text x="730" y="380" text-anchor="middle" fill="#7f1d1d">init_chat_model</text>
  <text x="730" y="396" text-anchor="middle" fill="#7f1d1d">DeepSeek, Gemini, Ollama</text>

  <rect x="820" y="340" width="140" height="74" rx="8" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="890" y="362" text-anchor="middle" font-weight="600" fill="#312e81">5 herramientas</text>
  <text x="890" y="380" text-anchor="middle" fill="#312e81">buscar_en_base</text>
  <text x="890" y="396" text-anchor="middle" fill="#312e81">consultar_datos y más</text>

  <rect x="820" y="480" width="140" height="70" rx="8" fill="#fae8ff" stroke="#c026d3"/>
  <text x="890" y="502" text-anchor="middle" font-weight="600" fill="#701a75">Qdrant + Ollama</text>
  <text x="890" y="520" text-anchor="middle" fill="#701a75">1.690 fragmentos</text>
  <text x="890" y="536" text-anchor="middle" fill="#701a75">embeddings nomic</text>

  <rect x="660" y="480" width="140" height="70" rx="8" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="730" y="502" text-anchor="middle" font-weight="600" fill="#134e4a">PostgreSQL</text>
  <text x="730" y="520" text-anchor="middle" fill="#134e4a">PostgresSaver (hilo)</text>
  <text x="730" y="536" text-anchor="middle" fill="#134e4a">PostgresStore (cliente)</text>

  <rect x="170" y="500" width="170" height="52" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="255" y="522" text-anchor="middle" font-weight="600" fill="#78350f">Persona de Celsia</text>
  <text x="255" y="540" text-anchor="middle" fill="#78350f">aprueba o rechaza</text>

  <!-- flechas -->
  <line x1="140" y1="235" x2="188" y2="235" stroke="#374151" stroke-width="1.6" marker-end="url(#flecha)"/>
  <text x="164" y="227" text-anchor="middle" fill="#374151">escribe</text>
  <line x1="188" y1="262" x2="142" y2="262" stroke="#374151" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#flecha)"/>
  <text x="164" y="276" text-anchor="middle" fill="#374151">responde</text>
  <line x1="320" y1="225" x2="374" y2="130" stroke="#374151" stroke-width="1.6" marker-end="url(#flecha)"/>
  <text x="308" y="168" text-anchor="end" fill="#374151">webhook</text>
  <text x="308" y="182" text-anchor="end" fill="#374151">(túnel https)</text>
  <line x1="374" y1="156" x2="322" y2="246" stroke="#374151" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#flecha)"/>
  <text x="255" y="302" text-anchor="middle" fill="#374151">la respuesta sale por</text>
  <text x="255" y="316" text-anchor="middle" fill="#374151">la Graph API de Meta</text>

  <line x1="140" y1="428" x2="374" y2="312" stroke="#374151" stroke-width="1.6" marker-end="url(#flecha)"/>

  <line x1="594" y1="140" x2="658" y2="140" stroke="#374151" stroke-width="1.6" marker-end="url(#flecha)"/>
  <line x1="594" y1="258" x2="658" y2="200" stroke="#374151" stroke-width="1.6" marker-end="url(#flecha)"/>
  <text x="640" y="252" text-anchor="middle" fill="#374151">turno</text>

  <line x1="730" y1="300" x2="730" y2="338" stroke="#374151" stroke-width="1.6" marker-end="url(#flecha)"/>
  <line x1="890" y1="300" x2="890" y2="338" stroke="#374151" stroke-width="1.6" marker-end="url(#flecha)"/>
  <line x1="890" y1="414" x2="890" y2="478" stroke="#374151" stroke-width="1.6" marker-end="url(#flecha)"/>
  <path d="M660 230 L636 230 L636 515 L658 515" fill="none" stroke="#374151" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#flecha)"/>
  <text x="632" y="470" text-anchor="end" font-size="11" fill="#374151">guarda cada</text>
  <text x="632" y="483" text-anchor="end" font-size="11" fill="#374151">turno</text>

  <line x1="340" y1="526" x2="374" y2="372" stroke="#374151" stroke-width="1.6" marker-end="url(#flecha)"/>
  <text x="270" y="494" text-anchor="middle" fill="#374151">decide</text>
  <line x1="594" y1="368" x2="658" y2="286" stroke="#d97706" stroke-width="1.6" marker-end="url(#flecha)"/>
  <text x="624" y="344" text-anchor="middle" fill="#78350f">reanuda</text>

  <text x="490" y="582" text-anchor="middle" fill="#4b5563">Línea continua: petición. Línea punteada: respuesta o guardado. El cliente recibe la decisión del reclamo por WhatsApp.</text>
</svg>
